services:

  simstudio:
    env_file:
      - path: .env
        required: false

    # app, realtime and migrations share a database schema and must move together,
    # so one variable drives all three. Set SIM_VERSION in .env to upgrade.
    image: ghcr.io/simstudioai/simstudio:${SIM_VERSION:-latest}

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 8G

    environment:
      - NODE_ENV=production

      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}

      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      # Additional trusted public origins, comma-separated.
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}

      # Known reverse-proxy IPs/CIDRs, comma-separated.
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-}

      # Required authentication secret.
      - 'BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?is required. Create a .env file next to docker-compose.prod.yml and set it to the output of: openssl rand -hex 32}'

      # Required encryption secret. Do not change after production data exists.
      - 'ENCRYPTION_KEY=${ENCRYPTION_KEY:?is required. Set it in .env to the output of: openssl rand -hex 32. It cannot be changed later without losing stored credentials.}'

      # Required internal API secret.
      - 'INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?is required. Set it in .env to the output of: openssl rand -hex 32}'

      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY:-}

      - CRON_SECRET=${CRON_SECRET:-}

      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

      - COPILOT_API_KEY=${COPILOT_API_KEY:-}

      - MSHIP_SYSPROMPT_OVERRIDE=${MSHIP_SYSPROMPT_OVERRIDE:-}

      - NEXT_PUBLIC_CHAT_DISABLED=${NEXT_PUBLIC_CHAT_DISABLED:-}

      - SIM_AGENT_API_URL=${SIM_AGENT_API_URL:-}

      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}

      # Internal realtime address used by the application.
      - SOCKET_SERVER_URL=${SOCKET_SERVER_URL:-http://realtime:3002}

      # Keep empty for now. We will configure it only if the public
      # Socket.IO route requires an explicit external URL.
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-}

      - ADMISSION_GATE_MAX_INFLIGHT=${ADMISSION_GATE_MAX_INFLIGHT:-500}

    # Allows workflows to reach services running on the Docker host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

    # The app needs the internal application network plus the EasyPanel
    # network so the EasyPanel reverse proxy can reach simstudio:3000.
    networks:
      - default
      - easypanel

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrations:
        condition: service_completed_successfully

      realtime:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3000
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s


  realtime:
    env_file:
      - path: .env
        required: false

    image: ghcr.io/simstudioai/realtime:${SIM_VERSION:-latest}

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 1G

    environment:
      - NODE_ENV=production

      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}

      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      - 'BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?is required and must match the value used by simstudio}'

      - 'INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?is required and must match the value used by simstudio}'

      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

    # Realtime needs both the internal application network for communication
    # with simstudio/db/redis and the EasyPanel network for reverse-proxy access.
    networks:
      - default
      - easypanel

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3002/health
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 10s


  migrations:
    image: ghcr.io/simstudioai/migrations:${SIM_VERSION:-latest}

    working_dir: /app/packages/db

    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-simstudio}

    depends_on:
      db:
        condition: service_healthy

    command:
      - bun
      - run
      - db:migrate

    restart: 'no'


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5


  cron:
    # The scheduler only makes HTTP calls and does not share the app DB schema.
    image: ghcr.io/simstudioai/cron:${SIM_CRON_VERSION:-latest}

    restart: on-failure

    environment:
      - SIM_URL=http://simstudio:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - TZ=${TZ:-America/Sao_Paulo}

    depends_on:
      simstudio:
        condition: service_healthy


  db:
    image: pgvector/pgvector:pg17

    restart: unless-stopped

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-simstudio}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:


# EasyPanel's reverse proxy uses this external network to reach the
# HTTP/WebSocket services. The normal Compose "default" network remains
# responsible for internal service-to-service communication.
networks:
  easypanel:
    external: true

